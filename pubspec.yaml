name: protector_dispositivos
description: Protector de Dispositivos - Seguridad Real (V2).
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Dependencias reales para interactuar con el hardware y sistema operativo
  flutter_jailbreak_detection: ^1.10.0 # Para detectar Root y Modo Desarrollador
  network_info_plus: ^5.0.3 # Para auditar la red Wi-Fi
  permission_handler: ^11.3.0 # Para gestionar permisos reales de Android
  oklch: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
